# XcodeGen 입력 — `make xcode` 또는 `xcodegen` 실행 시 ios/Sauna.xcodeproj 생성됨.
# https://github.com/yonaskolb/XcodeGen
#
# 이 파일이 정본 — Xcode 에서 직접 .pbxproj 손대지 말 것.
# 변경 시 git diff 가 사람이 읽을 수 있는 yaml 변경으로 남음.

name: Sauna
options:
  bundleIdPrefix: th1ngjin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  xcodeVersion: "16.2"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""               # set via xcconfig or scheme env in CI
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SaunaPackage:
    path: SaunaPackage

targets:
  Sauna:
    type: application
    platform: iOS
    sources:
      - path: SaunaApp
        excludes:
          - "**/.DS_Store"
    resources:
      - SaunaApp/Assets.xcassets
    info:
      path: SaunaApp/Info.plist
      properties:
        CFBundleDisplayName: Sauna
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        UILaunchScreen:
          UIColorName: ""
        # Runtime configuration — read by AppEnvironment.fromBundle().
        # Override per-scheme via xcconfig in CI.
        SAUNA_HTTP_BASE_URL: $(SAUNA_HTTP_BASE_URL)
        SAUNA_WS_BASE_URL: $(SAUNA_WS_BASE_URL)
        SAUNA_SENTRY_DSN: $(SAUNA_SENTRY_DSN)
        SAUNA_USE_STUB_ROOM: $(SAUNA_USE_STUB_ROOM)
        # Privacy strings (App Store 심사 필수 — 개별 권한 사용 시 채움)
        NSFaceIDUsageDescription: "패스키 등록 / 로그인에 Face ID 를 사용해."
        # Background networking (휘발성 채팅 — 백그라운드 모드 안 씀)
        UIBackgroundModes: []
        # Associated Domains for Passkey 는 entitlements 에서 처리
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: th1ngjin.Sauna
        PRODUCT_NAME: Sauna
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only (v1)
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SaunaApp/Sauna.entitlements
      configs:
        Debug: SaunaApp/Config/Sauna.Debug.xcconfig
        Release: SaunaApp/Config/Sauna.Release.xcconfig
    dependencies:
      - package: SaunaPackage
        product: SaunaApp
    scheme:
      testTargets:
        - SaunaTests
      gatherCoverageData: true

  SaunaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SaunaTests
    dependencies:
      - target: Sauna
schemes:
  Sauna:
    build:
      targets:
        Sauna: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SaunaTests
    archive:
      config: Release
