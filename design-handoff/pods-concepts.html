<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

// Minimal iOS phone frame (no external dep)
function Phone({ width = 390, height = 844, children }) {
  return (
    <div style={{
      width: width + 20, height: height + 20,
      padding: 10, borderRadius: 54,
      background: 'linear-gradient(145deg, #1a1a22 0%, #0b0b10 100%)',
      boxShadow: '0 24px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06)',
    }}>
      <div style={{
        width, height, borderRadius: 44, overflow: 'hidden',
        position: 'relative', background: '#0a0a0f',
      }}>
        {children}
        {/* Dynamic island */}
        <div style={{
          position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)',
          width: 120, height: 34, borderRadius: 18, background: '#000', zIndex: 200,
        }}/>
        {/* Status bar */}
        <div style={{
          position: 'absolute', top: 16, left: 0, right: 0, zIndex: 200,
          display: 'flex', justifyContent: 'space-between',
          padding: '0 32px', color: '#fff', fontSize: 15, fontWeight: 600,
          fontFamily: '"SF Pro Display", -apple-system, system-ui, sans-serif',
          pointerEvents: 'none',
        }}>
          <span>9:41</span>
          <span style={{display:'flex',alignItems:'center',gap:6}}>
            <svg width="18" height="11" viewBox="0 0 18 11" fill="none">
              <rect x="0" y="3" width="3" height="5" rx="0.6" fill="white"/>
              <rect x="4.5" y="2" width="3" height="6" rx="0.6" fill="white"/>
              <rect x="9" y="1" width="3" height="7" rx="0.6" fill="white"/>
              <rect x="13.5" y="0" width="3" height="8" rx="0.6" fill="white"/>
            </svg>
            <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
              <rect x="0.5" y="0.5" width="13" height="9" rx="2" stroke="white" strokeOpacity="0.4"/>
              <rect x="2" y="2" width="10" height="6" rx="0.8" fill="white"/>
              <rect x="14.5" y="3" width="1.5" height="3.5" rx="0.5" fill="white" fillOpacity="0.4"/>
            </svg>
          </span>
        </div>
      </div>
    </div>
  );
}

// Room switcher wrapper — controls the roomId tab inside each concept
function ConceptFrame({ Component, initialRoom = 'daily', showKeyboard = false }) {
  const [roomId, setRoomId] = React.useState(initialRoom);
  return (
    <div style={{position: 'relative'}}>
      <Phone width={390} height={844}>
        <Component roomId={roomId} keyboardUp={showKeyboard}/>
      </Phone>
      {/* Room selector chips below */}
      <div style={{
        position: 'absolute', top: -40, left: 0, right: 0,
        display: 'flex', justifyContent: 'center', gap: 8,
      }}>
        {['daily','stock','job'].map(id => (
          <button key={id} onClick={() => setRoomId(id)}
            style={{
              padding: '5px 12px', borderRadius: 999,
              fontSize: 11, fontWeight: 600,
              border: '1px solid ' + (roomId === id ? TOKENS.rooms[id].accent : 'rgba(0,0,0,0.15)'),
              background: roomId === id ? TOKENS.rooms[id].accent : 'rgba(255,255,255,0.6)',
              color: roomId === id ? '#000' : 'rgba(40,30,20,0.7)',
              cursor: 'pointer', letterSpacing: 0.3,
              fontFamily: '"Noto Sans KR", sans-serif',
            }}>
            {TOKENS.rooms[id].name}
          </button>
        ))}
      </div>
    </div>
  );
}

        <div style={{
          width: 720, padding: '22px 26px', borderRadius: 12,
          background: 'rgba(201,100,66,0.08)', border: '1px solid rgba(201,100,66,0.2)',
          color: 'rgba(40,30,20,0.85)', fontFamily: '-apple-system, system-ui, sans-serif',
          fontSize: 13, lineHeight: 1.65,

          <div style={{fontWeight: 700, marginBottom: 8, fontSize: 15, color: '#c96442'}}>작업 요약</div>
          <div style={{marginBottom: 6}}>✓ <b>V3 Speaker 제거</b> — 단일 화자 컨셉은 이 실험 방향과 맞지 않아 삭제.</div>
          <div style={{marginBottom: 6}}>✓ <b>V2 Crowd 리팩터</b> — 가중 랜덤 배치 (마지막 4개와 거리 확보 + 회전/스케일 분산).</div>
          <div style={{marginBottom: 6}}>✓ <b>공통 메시지 뱅크</b> — 방마다 6~10개 한글 메시지 풀에서 가중 랜덤 추출.</div>
          <div style={{marginBottom: 6}}>✓ <b>이어폰 시안 (V1)</b> — <code style={{background:'rgba(0,0,0,0.06)',padding:'1px 5px',borderRadius:3}}>pods-prototype.html</code> 보존.</div>
          <div style={{marginTop: 10, color: 'rgba(40,30,20,0.6)', fontSize: 12}}>
            각 시안은 "실시간성 — 지금 이 순간"이라는 정체성 축을 다르게 해석합니다.
            아무 카드나 풀스크린으로 열어 움직임을 오래 관찰해보세요.
          </div>
        </div>
      </DCSection>

      {/* ─── C01 · Bubble ───────────────────── */}
      <DCSection id="c01-bubble" title="C01 · Soap Bubble"
        subtitle="메시지가 바닥에서 떠올라 랜덤 경로로 부유하다 터진다. 휘발성 = 터짐. 발화는 작은 방울을 내보내는 행위. 메시지 길이에 따라 방울 크기가 바뀌고, 방끼리 다른 바닥색 + 색수차 막으로 구분.">
        <DCArtboard id="bubble-daily" label="일상 · 가장 활발한 방" width={410} height={900}>
          <ConceptFrame Component={window.ConceptBubble} initialRoom="daily"/>
        </DCArtboard>
        <DCArtboard id="bubble-stock" label="주식 · 노랑 아쿠아" width={410} height={900}>
          <ConceptFrame Component={window.ConceptBubble} initialRoom="stock"/>
        </DCArtboard>
        <DCArtboard id="bubble-kb" label="키보드 업 · 내 방울 합성" width={410} height={900}>
          <ConceptFrame Component={window.ConceptBubble} initialRoom="daily" showKeyboard={false}/>
        </DCArtboard>
      </DCSection>

      {/* ─── C02 · Dial ─────────────────────── */}
      <DCSection id="c02-dial" title="C02 · Frequency Dial"
        subtitle="라디오 주파수 튜닝 메타포. 방 = 주파수(88.3 / 104.7 / 97.1 MHz). 메시지는 좌→우로 흐르는 신호파로 표시되며 중앙 주파수 라인에 닿을 때만 풀 텍스트가 뜸. 노이즈 점 + 스캔라인 배경으로 '실시간 수신' 느낌 강조.">
        <DCArtboard id="dial-daily" label="일상 · 88.3 MHz" width={410} height={900}>
          <ConceptFrame Component={window.ConceptDial} initialRoom="daily"/>
        </DCArtboard>
        <DCArtboard id="dial-stock" label="주식 · 104.7 MHz" width={410} height={900}>
          <ConceptFrame Component={window.ConceptDial} initialRoom="stock"/>

        <DCArtboard id="dial-job" label="취준 · 97.1 MHz" width={410} height={900}>
          <ConceptFrame Component={window.ConceptDial} initialRoom="job"/>
        </DCArtboard>
      </DCSection>

      {/* ─── C03 · Ripple ───────────────────── */}
      <DCSection id="c03-ripple" title="C03 · Ripple Pool"
        subtitle="발화 = 물에 돌 던지기. 각 메시지는 랜덤 좌표에서 4겹 동심원 파문으로 퍼지고, 텍스트는 파문 중앙에 몇 초 떴다 사라짐. 겹치는 파문의 간섭이 '방의 분위기'를 시각화. 가장 조용한 시안.">
        <DCArtboard id="ripple-daily" label="일상" width={410} height={900}>
          <ConceptFrame Component={window.ConceptRipple} initialRoom="daily"/>

        <DCArtboard id="ripple-stock" label="주식" width={410} height={900}>
          <ConceptFrame Component={window.ConceptRipple} initialRoom="stock"/>

        <DCArtboard id="pulse-daily" label="일상 · 실시간 BPM" width={410} height={900}>
          <ConceptFrame Component={window.ConceptPulse} initialRoom="daily"/>
        </DCArtboard>
        <DCArtboard id="pulse-stock" label="주식 · 심박은 노랑" width={410} height={900}>
          <ConceptFrame Component={window.ConceptPulse} initialRoom="stock"/>
        </DCArtboard>
        <DCArtboard id="pulse-job" label="취준" width={410} height={900}>
          <ConceptFrame Component={window.ConceptPulse} initialRoom="job"/>
        </DCArtboard>

      {/* ─── C06 · Bunker ───────────────────── */}
      <DCSection id="c06-bunker" title="C06 · Bunker (벙커)"

        <DCArtboard id="sauna-stock" label="🔥 불가마 · 지글지글" width={410} height={900}>

        <DCArtboard id="sauna-job" label="♨ 열탕 · 정신 번쩍" width={410} height={900}>
          <ConceptFrame Component={window.ConceptSauna} initialRoom="job"/>

      </DCSection>

      {/* ─── C10 · Platform ─────────────────── */}
      <DCSection id="c10-platform" title="C10 · Platform (지하철 플랫폼) ★"

        <DCArtboard id="platform-job" label="분당선 · 취준행" width={410} height={900}>

      </DCSection>

      {/* ─── C11 · Cairn ───────────────────── */}
      <DCSection id="c11-cairn" title="C11 · Cairn (돌탑) ★"
        subtitle="한국 정서 심층 — 메시지 = 돌멩이. 깁이 길수록 큰 돌, 오래된 돌은 아래에 깔리며 이끼 띙슴래짐. 바람에 흔들리다가 많아지면 '와르르' 무너짐. 명상적·정적인 톤 — 담타 완전 반대 계열. 야구장 '응원 돌탑'으로 확장 가능.">
        <DCArtboard id="cairn-daily" label="마음돌탑 · 상아색 석재" width={410} height={900}>

        <DCArtboard id="cairn-stock" label="시세돌탑 · 황토색" width={410} height={900}>

      </DCSection>

      <DCSection id="c12-pager" title="C12 · Pager (샐샐 · 호출기)"
        subtitle="90년대 모토롤라 호출기 오마주. 메시지 = 숫자 코드 + 한 줄 해석. 8282(빨리빨리) 1004(천사) 0486(사랑해) 같은 밀레니얼 디지털 문화 오마주. 래트로하면서도 Gen-Z에게 신선함. LCD 화면과 스피커 그릴까지 실물감.">
        <DCArtboard id="pager-daily" label="*012 · DAILY.CH · 초록" width={410} height={900}>
          <ConceptFrame Component={window.ConceptPager} initialRoom="daily"/>
        </DCArtboard>
        <DCArtboard id="pager-stock" label="*827 · STOCK.CH · 애버" width={410} height={900}>

      {/* ─── V2 · Crowd (refreshed) ─────────── */}
      <DCSection id="v2-crowd" title="V2 · Crowd (가중 랜덤 리팩터)"
        subtitle="기존 V2를 가중 랜덤으로 재작업 — 마지막 4개 카드와 최소 거리 확보, 카드마다 미세한 회전/스케일 분산. 카드는 5~8초 살다가 페이드 소멸, 최근 10개만 유지.">
        <DCArtboard id="crowd-daily" label="일상" width={410} height={900}>
          <ConceptFrame Component={window.ConceptCrowd} initialRoom="daily"/>
        </DCArtboard>
        <DCArtboard id="crowd-stock" label="주식" width={410} height={900}>
          <ConceptFrame Component={window.ConceptCrowd} initialRoom="stock"/>
        </DCArtboard>
        <DCArtboard id="crowd-job" label="취준" width={410} height={900}>

        </DCArtboard>

      {/* ─── Next steps ─────────────────────── */}
      <DCSection id="next" title="다음 단계"
        subtitle="가장 마음에 드는 메타포를 고르시면 그 방향으로 깊게 파고 들겠습니다.">
        <div style={{
          width: 720, padding: '22px 26px', borderRadius: 12,
          background: 'rgba(255,255,255,0.5)', border: '1px solid rgba(0,0,0,0.08)',
          color: 'rgba(40,30,20,0.85)', fontFamily: '-apple-system, system-ui, sans-serif',
          fontSize: 13, lineHeight: 1.75,
        }}>
          <div style={{fontWeight: 700, marginBottom: 10, fontSize: 15}}>제 개인적 추천</div>
          <div style={{marginBottom: 8}}>🫧 <b>Bubble</b> — 휘발성 정체성과 가장 잘 맞음. 메시지가 "떠 있다가 터진다"는 게 비유적으로 완벽. 인터랙션도 자연스러움 (터치 = 터뜨리기).</div>
          <div style={{marginBottom: 8}}>💫 <b>Star</b> — 정서적으로 가장 깊음. "내 말이 별이 되어 잠시 빛난다"는 감정 — 외롭고 솔직한 앱의 톤에 맞음.</div>
          <div style={{marginBottom: 8}}>❤️ <b>Pulse</b> — '실시간성'을 가장 강하게 증명. 대화가 이 방을 살게 만들고 있다는 증거. 하지만 병원 느낌이 강해 톤이 갈릴 수 있음.</div>
          <div style={{marginTop: 14, paddingTop: 12, borderTop: '1px solid rgba(0,0,0,0.08)', fontSize: 12, color: 'rgba(40,30,20,0.6)'}}>
            다음에 할 수 있는 것: (1) 선택 방향의 인터랙션 깊게 — 탭/스와이프/입력 애니, (2) 온보딩 + 이름 생성, (3) 방 전환 모션, (4) 내가 보낸 메시지 특별 처리, (5) 침묵의 방 / 빈 상태.
          </div>
        </div>
