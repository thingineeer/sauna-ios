    @keyframes msg-vanish {

      100% { transform: translateY(-6px) scale(0.96); opacity: 0; filter: blur(6px); }

<!-- === design-canvas.jsx === -->
<script type="text/babel">

// DesignCanvas.jsx — Figma-ish design canvas wrapper
// Warm gray grid bg + Sections + Artboards + PostIt notes.
// Artboards are reorderable (grip-drag), labels/titles are inline-editable,
// and any artboard can be opened in a fullscreen focus overlay (←/→/Esc).
// State persists to a .design-canvas.state.json sidecar via the host
// bridge. No assets, no deps.
//
// Usage:
//   <DesignCanvas>
//     <DCSection id="onboarding" title="Onboarding" subtitle="First-run variants">
//       <DCArtboard id="a" label="A · Dusk" width={260} height={480}>…</DCArtboard>
//       <DCArtboard id="b" label="B · Minimal" width={260} height={480}>…</DCArtboard>
//     </DCSection>
//   </DesignCanvas>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// One-time CSS injection (classes are dc-prefixed so they don't collide with
// the hosted design's own styles).
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  // Esc exits focus; any outside pointerdown commits an in-progress rename.
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  // Portal to body so position:fixed is the real viewport regardless of any
  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      {/* top bar: section dropdown (left) · close (right) */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────
// Post-it — absolute-positioned sticky note
// ─────────────────────────────────────────────────────────────
function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, width,
      background: DC.postitBg, padding: '14px 16px',
      fontFamily: '"Comic Sans MS", "Marker Felt", "Segoe Print", cursive',
      fontSize: 14, lineHeight: 1.4, color: DC.postitText,
      boxShadow: '0 2px 8px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
      transform: `rotate(${rotate}deg)`,
      zIndex: 5,
    }}>{children}</div>
  );
}

Object.assign(window, { DesignCanvas, DCSection, DCArtboard, DCPostIt });


</script>

function IOSKeyboard({ dark = false }) {

<script type="text/babel">
// EarbudPod — original earbud-inspired orb. Three visual variants share
// the same footprint so they can be swapped in the tweaks panel.
//
// Variants:
//   'glass' - stylized glass orb with stem, subtle highlights
//   'neon'  - pure abstract circle with heavy sound-wave rings (sound-is-visible)
//   'hw'    - hardware-inspired CSS 3D-ish render
//
// Props:
//   side: 'L' | 'R'  (mirrors stem direction)
//   variant: one of above
//   roomAccent: hex color
//   state: 'idle' | 'active' | 'appearing' | 'disappearing' | 'reacting' | 'npc'
//   size: px for overall container width
//   reduceMotion: bool

function EarbudPod({ side = 'L', variant = 'glass', roomAccent = '#00FFB3',
                    state = 'idle', size = 150, reduceMotion = false,
                    children, onTap, onLongPress }) {
  const pressRef = React.useRef(null);
  const didLong = React.useRef(false);

  const startPress = (e) => {
    didLong.current = false;
    pressRef.current = setTimeout(() => {
      didLong.current = true;
      onLongPress && onLongPress(e);
    }, 400);
  };
  const endPress = (e) => {
    clearTimeout(pressRef.current);
    if (!didLong.current && onTap) onTap(e);
  };
  const cancelPress = () => clearTimeout(pressRef.current);

  const active = state === 'active' || state === 'appearing' || state === 'npc';
  const ring = state === 'npc' ? TOKENS.npc : roomAccent;

  const breathAnim = reduceMotion
    ? 'none'
    : active ? 'pod-breath-active 2.8s ease-in-out infinite'
             : 'pod-breath 2.4s ease-in-out infinite';

  return (
    <div
      onPointerDown={startPress}
      onPointerUp={endPress}
      onPointerLeave={cancelPress}
      onPointerCancel={cancelPress}
      style={{
        position: 'relative',
        width: size, height: size * 1.32,
        cursor: onTap ? 'pointer' : 'default',
        userSelect: 'none',
        touchAction: 'none',
      }}
    >
      <div style={{
        position: 'absolute', inset: 0,
        animation: breathAnim,
        willChange: 'transform',
      }}>
        {variant === 'glass' && <GlassPod side={side} size={size} active={active} accent={ring} state={state} />}
        {variant === 'neon'  && <NeonPod  side={side} size={size} active={active} accent={ring} state={state} reduceMotion={reduceMotion} />}
        {variant === 'hw'    && <HwPod    side={side} size={size} active={active} accent={ring} state={state} />}
      </div>

      {/* message content layer — absolute, unaffected by breath scale */}
      {children && (
        <div style={{
          position: 'absolute',
          top: 0, left: 0, width: size, height: size,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          padding: size * 0.12, boxSizing: 'border-box',
          pointerEvents: 'none', zIndex: 3,
        }}>
          {children}
        </div>
      )}
    </div>
  );
}

<script type="text/babel">
// WaveFlow — the signature L↔R wave motion (C12). Renders a dotted/
// continuous sine wave that travels between two points. Duration 1.8s.

function WaveFlow({ direction = 'LtoR', accent = '#00FFB3', width = 260,
                   height = 40, amplitude = 12, reduceMotion = false,
                   onComplete, active = true, text = '' }) {
  const duration = 4500;
  const [phase, setPhase] = React.useState(0); // 0..1
  const rafRef = React.useRef();

  React.useEffect(() => {
    if (!active) return;
    if (reduceMotion) {
      // fade-only fallback
      const t = setTimeout(() => onComplete && onComplete(), 500);
      return () => clearTimeout(t);
    }
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      setPhase(t);
      if (t < 1) rafRef.current = requestAnimationFrame(tick);
      else onComplete && onComplete();
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [active, reduceMotion]);

  if (!active) return null;

  if (reduceMotion) {
    return (
      <div style={{
        width, height,
        background: `radial-gradient(ellipse at center, ${accent}66 0%, transparent 70%)`,
        opacity: 1 - phase,
      }}/>
    );
  }

  // Ease phase for amp envelope: rises 0→1 in first 40%, stays, decays
  const env = phase < 0.4 ? phase / 0.4
            : phase < 0.75 ? 1
            : 1 - (phase - 0.75) / 0.25;
  const ampNow = amplitude * env;

  // Build sine path
  const steps = 80;
  const path = [];
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * width;
    const y = height / 2 + Math.sin((i / steps) * Math.PI * 3 + phase * Math.PI * 4) * ampNow;
    path.push((i === 0 ? 'M' : 'L') + x + ',' + y);
  }

  const flow = direction === 'LtoR' ? phase : 1 - phase;
  const dirL2R = direction === 'LtoR';

  // ── Ripple rings (water-drop C12) — emitted from the sender, 3 staggered ───
  const senderX = dirL2R ? 0 : width;
  const ripples = [0, 0.12, 0.24].map((delay, i) => {
    const rp = Math.max(0, Math.min(1, (phase - delay) / 0.55)); // 0..1 over 0.55
    if (rp <= 0 || rp >= 1) return null;
    const r = 8 + rp * (width * 0.35);
    const op = (1 - rp) * 0.55;
    return { r, op, key: i };
  }).filter(Boolean);

  // ── Flying text — each char rides the sine wave with per-char delay ────────
  const chars = text ? [...text].slice(0, 28) : [];
  const charSpan = 0.75;          // each char takes 75% of duration to travel (slow, floating)
  const charStagger = 0.012;      // tight stagger so message stays legible as a group
  const flyItems = chars.map((ch, i) => {
    const start = i * charStagger;
    const end = Math.min(1, start + charSpan);
    const t = Math.max(0, Math.min(1, (phase - start) / (end - start)));
    if (t <= 0 || t >= 1) return null;
    // Ease: slow middle (sine ease-in-out) so text hangs in air
    const eased = 0.5 - 0.5 * Math.cos(t * Math.PI);
    const p = dirL2R ? eased : 1 - eased;
    const x = p * width;
    const y = height / 2 + Math.sin(p * Math.PI * 3 + phase * Math.PI * 2) * ampNow;
    // fade in/out at edges
    const op = t < 0.12 ? t / 0.12 : t > 0.88 ? (1 - t) / 0.12 : 1;
    // slight rotation based on wave slope
    const slope = Math.cos(p * Math.PI * 3 + phase * Math.PI * 2) * 8;
    return { ch, x, y, op, rot: slope, key: i };
  }).filter(Boolean);

  return (
    <svg width={width} height={height} style={{ overflow: 'visible' }}>
      <defs>
        <linearGradient id={`wave-grad-${direction}-${accent}`} x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stopColor={accent} stopOpacity="0"/>
          <stop offset={`${Math.max(0, flow * 100 - 30)}%`} stopColor={accent} stopOpacity="0"/>
          <stop offset={`${flow * 100}%`} stopColor={accent} stopOpacity="1"/>
          <stop offset={`${Math.min(100, flow * 100 + 30)}%`} stopColor={accent} stopOpacity="0"/>
        </linearGradient>
        <filter id="wave-glow">
          <feGaussianBlur stdDeviation="2.5"/>
          <feComposite in2="SourceGraphic" operator="over"/>
        </filter>
      </defs>

      {/* Ripple rings from sender (water-drop pulse) */}
      {ripples.map(r => (
        <circle key={`ripple-${r.key}`}
          cx={senderX} cy={height / 2} r={r.r}
          fill="none" stroke={accent} strokeWidth="1.2"
          opacity={r.op}
          style={{ filter: `drop-shadow(0 0 6px ${accent}88)` }}/>
      ))}

      {/* Guide wave path (thin, always visible during flight) */}
      <path d={path.join(' ')}
        stroke={`url(#wave-grad-${direction}-${accent})`}
        strokeWidth="1.8" fill="none"
        strokeDasharray="2 5" strokeLinecap="round"
        opacity={0.7}
        filter="url(#wave-glow)"/>

      {/* Travel sparks (only when no text) */}
      {chars.length === 0 && [0, -0.1, -0.2, -0.3, -0.4].map((offset, i) => {
        const dotPhase = Math.max(0, Math.min(1, flow + offset));
        const x = dotPhase * width;
        const y = height / 2 + Math.sin(dotPhase * Math.PI * 3 + phase * Math.PI * 4) * ampNow;
        const op = (1 - Math.abs(offset) * 1.8) * env;
        return (
          <circle key={i} cx={x} cy={y} r={3 - i * 0.3}
            fill={accent} opacity={Math.max(0, op)}
            style={{ filter: `drop-shadow(0 0 4px ${accent})` }}/>
        );
      })}

      {/* Flying characters — sound-made-visible */}
      {flyItems.map(f => (
        <text key={`ch-${f.key}`}
          x={f.x} y={f.y}
          textAnchor="middle" dominantBaseline="central"
          fontFamily="'Noto Sans KR', 'Space Grotesk', sans-serif"
          fontSize="14" fontWeight="600"
          fill="#fff" opacity={f.op}
          transform={`rotate(${f.rot} ${f.x} ${f.y})`}
          style={{ filter: `drop-shadow(0 0 6px ${accent}) drop-shadow(0 0 2px ${accent})` }}>
          {f.ch}
        </text>
      ))}
    </svg>
  );
}

Object.assign(window, { WaveFlow });

</script>

<script type="text/babel">
// InteractivePrototype — S06 core-loop + S07 room-switch in one component.
// Drives real L/R message alternation and a live wave animation.

function InteractivePrototype({ variant = 'glass', reduceMotion = false, width = 390, height = 844 }) {
  const [roomId, setRoomId] = React.useState('daily');
  const [nextRoomId, setNextRoomId] = React.useState(null); // during transition
  const [transitionProgress, setTransitionProgress] = React.useState(0); // 0→1
  const swipeRef = React.useRef(null);

  // state per room, so switching preserves conversation state
  const [roomState, setRoomState] = React.useState(() => ({
    daily: { messages: { L: null, R: null }, wave: null, echo: null },
    stock: { messages: { L: null, R: null }, wave: null, echo: null },
    job:   { messages: { L: null, R: null }, wave: null, echo: null },
  }));
  const [inputValue, setInputValue] = React.useState('');
  const [reportMsg, setReportMsg] = React.useState(null);
  const [reportReason, setReportReason] = React.useState(null);
  const [reportSubmitted, setReportSubmitted] = React.useState(false);

  // Message bank — sample conversation per room
  const bank = React.useMemo(() => ({
    daily: [
      { text: '퇴근하고 싶다ㅠㅠ 누가 나 좀 구해줘',   nickname: '퇴근하고싶은판다#1203' },
      { text: '나도 ㅠㅠ 시계가 멈춘 것 같아',        nickname: '졸린곰#0042' },
      { text: '오늘 저녁 뭐 먹지… 치킨 각?',          nickname: '배고픈햄스터#7788' },
      { text: '치킨 찬성 🙋‍♀️',                     nickname: '화난여우#2111' },
      { text: '비 와서 분위기 좋다',                  nickname: '축축한수달#0909' },
      { text: '월요병 그 자체',                       nickname: '지친라쿤#5050' },
    ],
    stock: [
      { text: '오늘 장 뭐야 진짜',                    nickname: '불타는곰#3303' },
      { text: '물렸다… 계속 물렸다',                   nickname: '초록손개미#7700' },
      { text: '반도체 어떻게 생각해?',                 nickname: '차분한독수리#1155' },
    ],
    job: [
      { text: '자소서 10번째 고치는 중',              nickname: '지친올빼미#4747' },
      { text: '면접 끝났는데 망한 것 같아요',          nickname: '떨리는두더지#0110' },
    ],
  }), []);

  const bankIdx = React.useRef({ daily: 0, stock: 0, job: 0 });
  const nextSide = React.useRef('L'); // which pod the NEXT message should land on

  // Auto-drive messages (Flow 2). Every 2.2s push a new one into the
  // "empty" slot.
  React.useEffect(() => {
    const tick = () => {
      setRoomState(prev => {
        const cur = prev[roomId];
        const slot = nextSide.current;
        const msg = bank[roomId][bankIdx.current[roomId] % bank[roomId].length];
        bankIdx.current[roomId]++;
        const newMsgs = { ...cur.messages, [slot]: { ...msg, lifetime: 1.0, npc: false } };
        // Lifetime counter: decrement the OTHER message (it's older)
        const otherSlot = slot === 'L' ? 'R' : 'L';
        if (newMsgs[otherSlot]) {
          newMsgs[otherSlot] = { ...newMsgs[otherSlot], lifetime: Math.max(0, newMsgs[otherSlot].lifetime - 0.33) };
        }
        nextSide.current = otherSlot;
        return {
          ...prev,
          [roomId]: {
            ...cur,
            messages: newMsgs,
            wave: slot === 'L' ? 'RtoL' : 'LtoR', // wave travels TOWARD the new message
            waveText: msg.text,                     // text being delivered (flies across wave)
          },
        };
      });
    };
    const id = setInterval(tick, 2400);
    // initial kick
    const kick = setTimeout(tick, 600);
    return () => { clearInterval(id); clearTimeout(kick); };
  }, [roomId, bank]);

  const clearWave = (room) => {
    setRoomState(prev => ({ ...prev, [room]: { ...prev[room], wave: null, waveText: '' } }));
  };

  // Send user message
  const handleSend = () => {
    if (!inputValue.trim()) return;
    const text = inputValue.trim();
    setInputValue('');
    setRoomState(prev => ({
      ...prev,
      [roomId]: { ...prev[roomId], echo: text },
    }));
    setTimeout(() => {
      setRoomState(prev => ({ ...prev, [roomId]: { ...prev[roomId], echo: null } }));
    }, 3000);
  };

  // Swipe room transition
  const onPointerDown = (e) => {
    if (reportMsg || nextRoomId) return;
    swipeRef.current = { x0: e.clientX, id: e.pointerId, currentDx: 0 };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!swipeRef.current || e.pointerId !== swipeRef.current.id) return;
    const dx = e.clientX - swipeRef.current.x0;
    swipeRef.current.currentDx = dx;
    // threshold and direction
    const curIdx = ROOM_IDS.indexOf(roomId);
    if (Math.abs(dx) > 12) {
      const dir = dx > 0 ? -1 : 1;
      const nextIdx = curIdx + dir;
      if (nextIdx >= 0 && nextIdx < ROOM_IDS.length) {
        setNextRoomId(ROOM_IDS[nextIdx]);
        setTransitionProgress(Math.min(1, Math.abs(dx) / width));
      }
    }
  };
  const onPointerUp = (e) => {
    if (!swipeRef.current || e.pointerId !== swipeRef.current.id) return;
    const dx = swipeRef.current.currentDx;
    swipeRef.current = null;
    if (Math.abs(dx) > width * 0.3 && nextRoomId) {
      // commit: animate to 1, then swap
      setTransitionProgress(1);
      setTimeout(() => {
        setRoomId(nextRoomId);
        setNextRoomId(null);
        setTransitionProgress(0);
      }, 260);
    } else {
      // snap back
      setTransitionProgress(0);
      setTimeout(() => setNextRoomId(null), 260);
    }
  };

  // Tab click transition
  const handleTab = (target) => {
    if (target === roomId) return;
    const curIdx = ROOM_IDS.indexOf(roomId);
    const nextIdx = ROOM_IDS.indexOf(target);
    const dir = nextIdx > curIdx ? 1 : -1;
    setNextRoomId(target);
    // animate
    requestAnimationFrame(() => setTransitionProgress(1));
    setTimeout(() => {
      setRoomId(target);
      setNextRoomId(null);
      setTransitionProgress(0);
    }, 260);
  };

  const cur = roomState[roomId];
  const nxt = nextRoomId ? roomState[nextRoomId] : null;

  // Direction for the transition slide
  const curIdx = ROOM_IDS.indexOf(roomId);
  const nextIdx = nextRoomId ? ROOM_IDS.indexOf(nextRoomId) : curIdx;
  const slideDir = nextIdx > curIdx ? -1 : 1; // cur pans LEFT if next is RIGHT

  return (
    <div style={{
      width, height, overflow: 'hidden', position: 'relative',
      background: TOKENS.bg.base,
      borderRadius: 0,
    }}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}>

      {/* Current room */}
      <div style={{
        position: 'absolute', inset: 0,
        transform: `translateX(${nextRoomId ? slideDir * transitionProgress * width : 0}px)`,
        transition: swipeRef.current ? 'none' : 'transform 260ms cubic-bezier(0.5,0,0.2,1)',
      }}>
        <RoomScreen
          roomId={roomId}
          messages={cur.messages}
          waveActive={cur.wave}
          waveText={cur.waveText}
          onWaveComplete={() => clearWave(roomId)}
          variant={variant}
          reduceMotion={reduceMotion}
          onTab={handleTab}
          showEcho={cur.echo}
          inputValue={inputValue}
          onInputChange={setInputValue}
          onSend={handleSend}
          onLongPressMessage={(slot) => setReportMsg({ ...cur.messages[slot], slot })}
          width={width} height={height}
        />
      </div>

      {/* Next room (during transition) */}
      {nextRoomId && (
        <div style={{
          position: 'absolute', inset: 0,
          transform: `translateX(${-slideDir * (1 - transitionProgress) * width}px)`,
          transition: swipeRef.current ? 'none' : 'transform 260ms cubic-bezier(0.5,0,0.2,1)',
        }}>
          <RoomScreen
            roomId={nextRoomId}
            messages={nxt.messages}
            waveActive={null}
            variant={variant}
            reduceMotion={reduceMotion}
            width={width} height={height}
            onTab={() => {}}
          />
        </div>
      )}

      {/* Report sheet */}
      {reportMsg && !reportReason && !reportSubmitted && (
        <ReportSheet
          message={reportMsg}
          accent={TOKENS.rooms[roomId].accent}
          onClose={() => setReportMsg(null)}
          onReport={() => setReportReason('_select_')}
        />
      )}

      {/* Report form */}
      {reportMsg && reportReason && !reportSubmitted && (
        <ReportForm
          message={reportMsg}
          accent={TOKENS.rooms[roomId].accent}
          onClose={() => { setReportMsg(null); setReportReason(null); }}
          selectedReason={reportReason === '_select_' ? null : reportReason}
          onSelectReason={(r) => setReportReason(r)}
          onSubmit={() => {
            setReportSubmitted(true);
            setTimeout(() => {
              setReportMsg(null);
              setReportReason(null);
              setReportSubmitted(false);
            }, 1500);
          }}
        />
      )}

      {/* Submitted toast */}
      {reportSubmitted && (
        <div style={{
          position: 'absolute',
          bottom: 100, left: '50%', transform: 'translateX(-50%)',
          padding: '12px 20px', borderRadius: 12,
          background: 'rgba(0,210,106,0.15)',
          border: '1px solid rgba(0,210,106,0.4)',
          color: '#00D26A', fontSize: 14, fontWeight: 500,
          fontFamily: "'Noto Sans KR', sans-serif",
          zIndex: 50,
          animation: 'echo-rise 1.5s ease-out forwards',
        }}>
          ✓ 신고 접수됐어요
        </div>
      )}
    </div>
  );
}

Object.assign(window, { InteractivePrototype });

</script>

function WaveSnapshot({ phase, accent, width, height, text = '나 간다' }) {
  const env = phase < 0.4 ? phase / 0.4 : phase < 0.75 ? 1 : 1 - (phase - 0.75) / 0.25;
  const amp = 12 * env;
  const steps = 60;
  const path = [];
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * width;
    const y = height / 2 + Math.sin((i / steps) * Math.PI * 3 + phase * Math.PI * 4) * amp;
    path.push((i === 0 ? 'M' : 'L') + x + ',' + y);
  }
  // Ripple rings from sender (left)
  const ripples = [0, 0.12, 0.24].map((d, i) => {
    const rp = Math.max(0, Math.min(1, (phase - d) / 0.55));
    if (rp <= 0 || rp >= 1) return null;
    return { r: 8 + rp * (width * 0.35), op: (1 - rp) * 0.55, key: i };
  }).filter(Boolean);

  // Flying characters along sine path
  const chars = [...text].slice(0, 20);
  const flyItems = chars.map((ch, i) => {
    const start = i * 0.04;
    const end = start + 0.25;
    const t = Math.max(0, Math.min(1, (phase - start) / (end - start)));
    if (t <= 0 || t >= 1) return null;
    const x = t * width;
    const y = height / 2 + Math.sin(t * Math.PI * 3 + phase * Math.PI * 4) * amp;
    const op = t < 0.15 ? t / 0.15 : t > 0.85 ? (1 - t) / 0.15 : 1;
    const rot = Math.cos(t * Math.PI * 3 + phase * Math.PI * 4) * 10;
    return { ch, x, y, op, rot, key: i };
  }).filter(Boolean);

  return (
    <svg width={width} height={height} style={{overflow: 'visible'}}>
      <defs>
        <linearGradient id={`ws-${phase}`} x1="0%" x2="100%">
          <stop offset="0%" stopColor={accent} stopOpacity="0"/>
          <stop offset={`${Math.max(0, phase * 100 - 30)}%`} stopColor={accent} stopOpacity="0"/>
          <stop offset={`${phase * 100}%`} stopColor={accent} stopOpacity="1"/>
          <stop offset={`${Math.min(100, phase * 100 + 30)}%`} stopColor={accent} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {/* Ripples from sender */}
      {ripples.map(r => (
        <circle key={`r-${r.key}`} cx={0} cy={height/2} r={r.r}
          fill="none" stroke={accent} strokeWidth="1.2" opacity={r.op}
          style={{filter: `drop-shadow(0 0 5px ${accent})`}}/>
      ))}
      <path d={path.join(' ')}
        stroke={`url(#ws-${phase})`}
        strokeWidth="1.8" fill="none"
        strokeDasharray="2 5" strokeLinecap="round"
        opacity={0.7}
        style={{filter: `drop-shadow(0 0 4px ${accent})`}}/>
      {/* Flying characters */}
      {flyItems.map(f => (
        <text key={`c-${f.key}`} x={f.x} y={f.y}
          textAnchor="middle" dominantBaseline="central"
          fontFamily="'Noto Sans KR', sans-serif"
          fontSize="13" fontWeight="600"
          fill="#fff" opacity={f.op}
          transform={`rotate(${f.rot} ${f.x} ${f.y})`}
          style={{filter: `drop-shadow(0 0 4px ${accent}) drop-shadow(0 0 2px ${accent})`}}>
          {f.ch}
        </text>
      ))}
    </svg>
  );
}

Object.assign(window, { OnboardingScreen, WaveShowcase, WaveSnapshot });

</script>

      '스터디 구함', '이력서 봐주세요', '멘탈 나감',
      '합격했다!!', '축하해…', '나도 잘 될까',
    ],
  }), []);

  const sourceBank = bank || defaultBank[roomId] || defaultBank.daily;

  // ── State: an array of active floating messages ────────────────────
  // Each: { id, text, nick, x, yStart, spawnAt, lifespan, isMine, slot }
  const [msgs, setMsgs] = React.useState([]);
  const idRef = React.useRef(0);
  const bankIdx = React.useRef(0);

  // Slot assignment — avoid overlap by cycling through 5 horizontal lanes
  const LANES = 5;
  const laneOccupancy = React.useRef(Array(LANES).fill(0));
  const pickLane = () => {
    // choose lane with oldest last-use
    let best = 0; let oldest = laneOccupancy.current[0];
    for (let i = 1; i < LANES; i++) {
      if (laneOccupancy.current[i] < oldest) { oldest = laneOccupancy.current[i]; best = i; }
    }
    laneOccupancy.current[best] = Date.now();
    return best;
  };

  const spawnMsg = React.useCallback((override = {}) => {
    const lane = pickLane();
    // lane-based x: distribute across full width with 12% padding
    const padX = 0.08;
    const xFrac = padX + (lane + 0.5 + (Math.random() - 0.5) * 0.35) / LANES * (1 - padX * 2);
    const text = override.text || sourceBank[bankIdx.current % sourceBank.length];
    if (!override.text) bankIdx.current++;
    const nick = override.nick || SAMPLE_NICKS[(bankIdx.current * 37) % SAMPLE_NICKS.length];
    const isMine = !!override.isMine;
    idRef.current++;
    const now = performance.now();
    const lifespan = 3800 + Math.random() * 1200;  // 3.8-5s per message
    const newMsg = {
      id: idRef.current,
      text,
      nick,
      x: xFrac,
      spawnAt: now,
      lifespan,
      isMine,
      driftX: (Math.random() - 0.5) * 24,   // gentle horizontal drift
    };
    setMsgs(prev => [...prev, newMsg]);
    // schedule removal
    setTimeout(() => {
      setMsgs(prev => prev.filter(m => m.id !== newMsg.id));
    }, lifespan + 400);
  }, [sourceBank]);

  // Auto-spawn at density-appropriate rate
  React.useEffect(() => {
    const interval = density === 'high' ? 520 : 900;
    const tick = () => spawnMsg();
    // kick a few to populate immediately
    for (let i = 0; i < 6; i++) {
      setTimeout(() => spawnMsg(), i * 180);
    }
    const id = setInterval(tick, interval);
    return () => clearInterval(id);
  }, [spawnMsg, density]);

  // When myEchoText changes (user sent), spawn it as "mine"
  const prevEchoRef = React.useRef('');
  React.useEffect(() => {
    if (myEchoText && myEchoText !== prevEchoRef.current) {
      prevEchoRef.current = myEchoText;
      spawnMsg({ text: myEchoText, nick: '나', isMine: true });
    }
  }, [myEchoText, spawnMsg]);

  // ── Layout zones ───────────────────────────────────────────────────

  const chatTop = HEADER_H;

// ── Single floating message ─────────────────────────────────────────
function CrowdMessage({ msg, chatH, chatW, accent, reduceMotion, onTap }) {
  const [t, setT] = React.useState(0); // 0..1 life progress
  const rafRef = React.useRef();

  React.useEffect(() => {
    if (reduceMotion) {
      // simple fade — stay put
      const id = setTimeout(() => setT(1), msg.lifespan);
      return () => clearTimeout(id);
    }
    const tick = (now) => {
      const p = Math.min(1, (now - msg.spawnAt) / msg.lifespan);
      setT(p);
      if (p < 1) rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [msg.id, msg.spawnAt, msg.lifespan, reduceMotion]);

  // Y: starts near bottom, floats upward smoothly
  const yStart = chatH * 0.92;
  const yEnd = chatH * 0.05;
  // ease-out cubic for gentle float
  const easeT = 1 - Math.pow(1 - t, 2.2);
  const y = yStart + (yEnd - yStart) * easeT;
  const x = msg.x * chatW + msg.driftX * easeT;

  // Opacity — fade in (0-12%), hold, fade out (70-100%)
  const op = t < 0.12 ? t / 0.12 : t > 0.7 ? Math.max(0, (1 - t) / 0.30) : 1;

  // Scale — slight appear bounce, then shrink slightly as it rises
  const scale = t < 0.1 ? 0.88 + t * 1.2
              : 1.0 - easeT * 0.08;

  const blurOut = t > 0.75 ? (t - 0.75) * 12 : 0;

  // nick color — use accent tint for "[이름]" bracket pattern
  const nickColor = msg.isMine ? accent : TOKENS.text.secondary;

  return (
    <div
      onClick={onTap}
      style={{
        position: 'absolute',
        left: x, top: y,
        transform: `translate(-50%, -50%) scale(${scale})`,
        maxWidth: chatW * 0.78,
        opacity: op,
        filter: blurOut ? `blur(${blurOut}px)` : 'none',
        willChange: 'transform, opacity',
        cursor: msg.isMine ? 'default' : 'pointer',
        userSelect: 'none',
        padding: msg.isMine ? '8px 14px' : '6px 12px',
        borderRadius: 16,
        background: msg.isMine
          ? `linear-gradient(135deg, ${accent}26 0%, ${accent}14 100%)`
          : 'rgba(255,255,255,0.018)',
        border: msg.isMine ? `1px solid ${accent}66` : '1px solid transparent',
        boxShadow: msg.isMine
          ? `0 0 24px ${accent}33, 0 0 8px ${accent}55, inset 0 1px 0 rgba(255,255,255,0.08)`
          : 'none',
        backdropFilter: msg.isMine ? 'blur(8px)' : 'none',
        WebkitBackdropFilter: msg.isMine ? 'blur(8px)' : 'none',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
        textOverflow: 'ellipsis',
      }}>
      <span className="mono" style={{
        fontSize: 10, fontWeight: 600,
        color: nickColor,
        letterSpacing: 0.4,
        marginRight: 7,
        opacity: msg.isMine ? 1 : 0.62,
      }}>
        [{msg.nick}]
      </span>
      <span className="kor" style={{
        fontSize: msg.isMine ? 15 : 14,
        lineHeight: 1.35,
        fontWeight: msg.isMine ? 600 : 500,
        color: msg.isMine ? '#fff' : 'rgba(255,255,255,0.88)',
        textShadow: msg.isMine
          ? `0 0 8px ${accent}99, 0 1px 2px rgba(0,0,0,0.8)`
          : '0 1px 3px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.9)',
      }}>
        {msg.text}
      </span>
    </div>
  );
}

// ── Equalizer bars above the speaker ───────────────────────────────
function EqualizerBars({ bottom, width, pulse, accent, reduceMotion }) {
  const [bars, setBars] = React.useState([]);
  React.useEffect(() => {
    if (reduceMotion) {
      setBars(Array(24).fill(0).map(() => 0.3));
      return;
    }
    let raf;
    const tick = () => {
      setBars(prev => {
        const n = 24;
        return Array(n).fill(0).map((_, i) => {
          const base = 0.18 + 0.12 * Math.sin(performance.now() / 400 + i * 0.6);
          const noise = Math.random() * 0.18 * (0.4 + pulse);
          return Math.min(1, base + noise + pulse * 0.32);
        });
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [pulse, reduceMotion]);

  const barW = 6;
  const gap = 4;
  const totalW = bars.length * (barW + gap) - gap;
  return (
    <div style={{
      position: 'absolute',
      left: '50%', bottom,
      transform: 'translateX(-50%)',
      display: 'flex', alignItems: 'flex-end', gap,
      height: 46, zIndex: 3,
      pointerEvents: 'none',
      width: totalW,
    }}>
      {bars.map((h, i) => (
        <div key={i} style={{
          width: barW,
          height: 2 + h * 44,
          borderRadius: 2,
          background: `linear-gradient(180deg, ${accent} 0%, ${accent}66 100%)`,
          boxShadow: `0 0 6px ${accent}88`,
          transition: reduceMotion ? 'none' : 'height 100ms linear',
        }}/>
      ))}
    </div>
  );
}

// ── A single message broadcasted out of the speaker ─────────────────
function SpeakerMessage({ msg, chatW, chatH, accent, reduceMotion }) {
  const [t, setT] = React.useState(0);
  const rafRef = React.useRef();

  React.useEffect(() => {
    if (reduceMotion) {
      const id = setTimeout(() => setT(1), msg.lifespan);
      return () => clearTimeout(id);
    }
    const tick = (now) => {
      const p = Math.min(1, (now - msg.spawnAt) / msg.lifespan);
      setT(p);
      if (p < 1) rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [msg.id, msg.spawnAt, msg.lifespan, reduceMotion]);

  // ease-out cubic for float
  const easeT = 1 - Math.pow(1 - t, 2.4);
  // y: start just above speaker (bottom of chat zone), rise to top
  const yStart = chatH * 0.96;
  const yEnd = chatH * 0.04;
  const y = yStart + (yEnd - yStart) * easeT;
  // x: lane + slight sway
  const lanes = 5;
  const laneX = (msg.lane + 0.5) / lanes * chatW;
  const sway = Math.sin(t * Math.PI * 2.2 + msg.id * 0.9) * 12 * easeT;
  const x = laneX + sway;

  // Scale: tiny at bottom (just emerged from speaker), grows as it travels
  const scale = 0.72 + easeT * 0.52;

  const op = t < 0.1 ? t / 0.1 : t > 0.75 ? Math.max(0, (1 - t) / 0.25) : 1;
  const blur = t > 0.8 ? (t - 0.8) * 8 : 0;

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(-50%, -50%) scale(${scale})`,
      maxWidth: chatW * 0.78,
      opacity: op,
      filter: blur ? `blur(${blur}px)` : 'none',
      willChange: 'transform, opacity',
      padding: msg.isMine ? '8px 14px' : '6px 12px',
      borderRadius: 16,
      background: msg.isMine
        ? `linear-gradient(135deg, ${accent}30 0%, ${accent}18 100%)`
        : 'rgba(255,255,255,0.025)',
      border: msg.isMine ? `1px solid ${accent}88` : '1px solid transparent',
      boxShadow: msg.isMine
        ? `0 0 24px ${accent}44, 0 0 8px ${accent}66, inset 0 1px 0 rgba(255,255,255,0.08)`
        : 'none',
      backdropFilter: msg.isMine ? 'blur(8px)' : 'none',
      WebkitBackdropFilter: msg.isMine ? 'blur(8px)' : 'none',
      whiteSpace: 'nowrap',
    }}>
      <span className="mono" style={{
        fontSize: 10, fontWeight: 600,
        color: msg.isMine ? accent : TOKENS.text.secondary,
        letterSpacing: 0.4,
        marginRight: 7,
        opacity: msg.isMine ? 1 : 0.55,
      }}>[{msg.nick}]</span>
      <span className="kor" style={{
        fontSize: msg.isMine ? 15 : 14,
        fontWeight: msg.isMine ? 600 : 500,
        color: msg.isMine ? '#fff' : 'rgba(255,255,255,0.9)',
        textShadow: msg.isMine
          ? `0 0 8px ${accent}99, 0 1px 2px rgba(0,0,0,0.8)`
          : '0 1px 3px rgba(0,0,0,0.9)',
      }}>{msg.text}</span>
    </div>
  );
}

function SpeakerRoomWithKeyboard(props) { return <SpeakerRoom {...props} keyboardUp={true}/>; }
function SpeakerRoomWithMyEcho(props) {
  const [echo, setEcho] = React.useState('');
  const samples = ['나도 그래', '치맥 ㄱ', '오늘은 내가 산다', '진짜 월요병이다'];
  React.useEffect(() => {
    const tick = () => setEcho(samples[Math.floor(Math.random() * samples.length)] + ' ' + Date.now());
    const id = setInterval(tick, 3800);
    const kick = setTimeout(tick, 900);
    return () => { clearInterval(id); clearTimeout(kick); };
  }, []);
  return <SpeakerRoom {...props} myEchoText={echo}/>;
}

Object.assign(window, { SpeakerRoom, Speaker, EqualizerBars, SpeakerMessage, SpeakerRoomWithKeyboard, SpeakerRoomWithMyEcho });

// S06 with an active wave + recent message on R
function S06WithActiveWave({ variant }) {
  const [waveActive, setWaveActive] = React.useState('LtoR');
  React.useEffect(() => {
    const loop = () => {
      setWaveActive(null);
      setTimeout(() => setWaveActive('LtoR'), 400);
    };
    const i = setInterval(loop, 2400);
    return () => clearInterval(i);
  }, []);
  return (
    <RoomScreen
      roomId="daily"
      messages={{
        L: { text: '누가 치맥 ㄱ', nickname: '배고픈햄스터#7788', lifetime: 0.48 },
        R: { text: '나 간다', nickname: '퇴근한판다#1203', lifetime: 0.98 },
      }}
      waveActive={waveActive}
      waveText="나 간다"
      onWaveComplete={() => setWaveActive(null)}
      variant={variant}
    />
  );
}

// S07 — 50% mid-transition snapshot (daily → stock)

  return (

        }}/>

    </div>
  );
}
