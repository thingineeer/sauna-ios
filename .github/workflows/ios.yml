name: iOS CI

on:
  pull_request:
    branches: [1.0.0, dev, main, release]
    paths-ignore:
      - "docs/**"
      - "design-handoff/**"
      - "README.md"
      - "**/*.md"
  push:
    branches: [1.0.0, dev, main, release]
    paths-ignore:
      - "docs/**"
      - "design-handoff/**"
      - "README.md"
      - "**/*.md"
    # v* 태그 push 시에는 TestFlight 업로드 잡까지 간다.
    tags:
      - "v*"
  # Manual trigger — billing-paused 환경에서 paid macOS 잡 수동 실행용.
  workflow_dispatch:

# Cancel in-flight runs on the same ref (PR or branch) when a new commit lands.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IOS_DIR: ios
  TUIST_VERSION: "4.43.2"
  # macos-15 default Xcode is 16.4 (Swift 6.0). 로컬 Xcode 26 / iPhone 17 simulator 를
  # 그대로 쓰려면 macos-26 가 GA 되거나 self-hosted runner 가 필요. 현재는 macos-15
  # + iPhone 16 simulator 조합으로 deployment target(iOS 17+) 검증.
  SIMULATOR: "iPhone 16"

jobs:
  build-test:
    name: Build & Test (Tuist)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select default Xcode
        run: sudo xcode-select -s "/Applications/Xcode.app"

      - name: List installed Xcodes (debug)
        run: ls /Applications | grep -i ^Xcode || true

      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          tool_versions: |
            tuist ${{ env.TUIST_VERSION }}

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Cache Tuist external SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.IOS_DIR }}/Tuist/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-tuist-${{ env.TUIST_VERSION }}-${{ hashFiles(format('{0}/Tuist/Package.swift', env.IOS_DIR), format('{0}/Tuist/Package.resolved', env.IOS_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-tuist-${{ env.TUIST_VERSION }}-

      - name: Tuist install (외부 SPM)
        working-directory: ${{ env.IOS_DIR }}
        run: tuist install

      - name: Tuist generate
        working-directory: ${{ env.IOS_DIR }}
        run: tuist generate --no-open

      - name: Build (Sauna)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          xcodebuild -workspace Sauna.xcworkspace -scheme Sauna \
            -destination "platform=iOS Simulator,name=$SIMULATOR,OS=latest" \
            -configuration Debug build

      - name: Test (per-module)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          PASS=0; FAIL=0
          for s in Domain Data PixelMascot Observability \
                   FeatureOnboarding FeatureHome FeatureRoom FeatureMe; do
            echo "::group::Test $s"
            out=$(xcodebuild test -workspace Sauna.xcworkspace -scheme "$s" \
              -destination "platform=iOS Simulator,name=$SIMULATOR,OS=latest" 2>&1) || {
                echo "$out" | tail -30
                FAIL=$((FAIL + 1))
                echo "::endgroup::"
                continue
              }
            p=$(echo "$out" | grep -cE "Test Case .* passed" || true)
            f=$(echo "$out" | grep -cE "Test Case .* failed" || true)
            echo "$s : $p passed / $f failed"
            PASS=$((PASS + p))
            [ "$f" -gt 0 ] && FAIL=$((FAIL + 1))
            echo "::endgroup::"
          done
          echo "Total: $PASS passed across modules"
          [ "$FAIL" -eq 0 ]

      - name: Skip coverage export (Tuist 단계 — 추후 추가)
        if: false
        run: echo "TODO"

      - name: Upload coverage artifact
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage-${{ github.run_id }}
          path: coverage-report/
          if-no-files-found: warn
          retention-days: 14

  lint:
    # SwiftLint은 Linux 컨테이너에서 돈다. macos 분 (10x cost) 절약 + 결정론.
    name: SwiftLint (strict)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.57.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint (warnings as errors)
        run: swiftlint lint --strict --config .swiftlint.yml ios/Projects server/Sources

  # ────────────────────────────────────────────────────────────────────────
  # TestFlight upload — only on `v*` tag push, after build-test + lint green.
  # ────────────────────────────────────────────────────────────────────────
  testflight:
    name: TestFlight (Fastlane)
    needs: [build-test, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_CHANGELOG: ${{ github.event.head_commit.message }}
      # Sauna runtime config — Release.xcconfig 가 $(SAUNA_*) 로 읽음.
      SAUNA_HTTP_BASE_URL: ${{ vars.SAUNA_HTTP_BASE_URL || 'https://api.sauna.app' }}
      SAUNA_WS_BASE_URL:   ${{ vars.SAUNA_WS_BASE_URL   || 'wss://api.sauna.app' }}
      SAUNA_SENTRY_DSN:    ${{ secrets.SAUNA_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select default Xcode
        run: sudo xcode-select -s "/Applications/Xcode.app"

      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          tool_versions: |
            tuist ${{ env.TUIST_VERSION }}

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Tuist install (외부 SPM)
        working-directory: ios
        run: tuist install

      - name: Tuist generate (.xcworkspace + 14× .xcodeproj)
        working-directory: ios
        run: tuist generate --no-open

      - name: Fastlane beta (workspace 기반)
        working-directory: ios
        run: bundle exec fastlane beta

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauna-ipa-${{ github.run_id }}
          path: ios/build/*.ipa
          if-no-files-found: warn
          retention-days: 14
