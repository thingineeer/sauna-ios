# SwiftLint configuration — Sauna iOS monorepo
# Docs: https://realm.github.io/SwiftLint/
#
# Tone: keep CI strict on safety/correctness rules but easy on subjective style.
# `swiftlint lint --strict` (in CI) treats warnings as errors, so be deliberate
# about which rules emit at warning severity.

# ── Paths ────────────────────────────────────────────────────────────────────
included:
  - ios/SaunaPackage/Sources
  - server/Sources

excluded:
  - .build
  - "**/.build"
  - ios/SaunaPackage/.build
  - server/.build
  - "**/Tests"
  - "**/*Tests"
  - DerivedData
  - "**/DerivedData"
  - design-handoff
  - docs

# ── Opt-in rules (correctness > style) ───────────────────────────────────────
opt_in_rules:
  - closure_end_indentation
  - force_unwrapping
  - redundant_type_annotation
  - closure_spacing
  - collection_alignment
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - implicit_return
  - joined_default_parameter
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Disable rules that fight our SwiftUI / module style.
disabled_rules:
  - todo                         # TODO/FIXME comments are useful in a WIP repo
  - trailing_comma               # SwiftUI builders read better with trailing commas
  - opening_brace                # SwiftUI multi-line modifier chains conflict
  - multiple_closures_with_trailing_closure  # SwiftUI common pattern

# ── Rule tuning ──────────────────────────────────────────────────────────────
line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 350
  error: 600

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 80
  excluded:
    - id
    - x
    - y
    - r
    - g
    - b
    - to
    - up
    - on

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 80

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 3

# Force-unwrapping is opt-in above; keep it as a warning so prototype code can
# still build but CI's --strict turns it into a failure for production paths.
force_unwrapping:
  severity: warning

force_cast:
  severity: warning

force_try:
  severity: warning

reporter: "github-actions-logging"
